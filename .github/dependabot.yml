# Автоматические PR с обновлениями зависимостей. Раз в неделю, обновления одного типа собираются в один PR,
# чтобы не засорять репозиторий. Каждый такой PR проходит тот же CI, что и обычный.
version: 2
updates:
  # Python-зависимости трёх независимых проектов (uv.lock обновляется вместе с pyproject.toml)
  - package-ecosystem: uv
    directory: /services/api
    schedule: {interval: weekly}
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /services/web
    schedule: {interval: weekly}
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /services/payment_stub
    schedule: {interval: weekly}
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  # Базовые образы в Dockerfile (python, uv)
  - package-ecosystem: docker
    directories: [/services/api, /services/web, /services/payment_stub, /deploy/backup]
    schedule: {interval: weekly}

  # Образы в compose-файлах (postgres, redis, rabbitmq, nginx, prometheus и т.д.)
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule: {interval: weekly}

  # Действия GitHub Actions в workflows
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions:
        patterns: ["*"]
