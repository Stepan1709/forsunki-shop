name: forsunki

# Ротация Docker-логов на каждом контейнере: без неё json-file растёт бесконечно.
# labels: Docker кладёт имя сервиса compose в каждую запись лога (поле attrs). По нему Fluent Bit узнаёт,
# от какого контейнера пришла строка, даже если сам контейнер (Postgres, RabbitMQ) пишет не JSON.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    labels: "com.docker.compose.service"

# Общие настройки api, worker и migrate: один образ, разные команды.
x-api-build: &api-build
  image: forsunki-api:dev
  build:
    context: ..
    dockerfile: services/api/Dockerfile

x-api-env: &api-env
  ENV: ${ENV:-dev}
  POSTGRES_HOST: postgres
  POSTGRES_USER: ${POSTGRES_USER:-forsunki}
  POSTGRES_DB: ${POSTGRES_DB:-forsunki}
  REDIS_HOST: redis
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_USER: ${RABBITMQ_USER:-forsunki}
  # Адрес приёма трасс (Jaeger). Пусто: трассировка выключена. make up-full задаёт его вместе с профилем tracing.
  OTEL_ENDPOINT: ${OTEL_ENDPOINT:-}

# Сети разделены по назначению. `data` внутренняя (internal): из неё нет выхода наружу,
# а хранилища доступны только приложениям. В dev порты пробрасывает compose.dev.yml.
networks:
  edge: {}
  backend: {}
  data:
    internal: true

# Пароли лежат в файлах и монтируются в /run/secrets/<имя>, а не в environment.
secrets:
  postgres_password:
    file: ${SECRETS_DIR:-./secrets/dev}/postgres_password
  redis_password:
    file: ${SECRETS_DIR:-./secrets/dev}/redis_password
  rabbitmq_password:
    file: ${SECRETS_DIR:-./secrets/dev}/rabbitmq_password
  s3_access_key:
    file: ${SECRETS_DIR:-./secrets/dev}/s3_access_key
  s3_secret_key:
    file: ${SECRETS_DIR:-./secrets/dev}/s3_secret_key
  payment_api_key:
    file: ${SECRETS_DIR:-./secrets/dev}/payment_api_key
  payment_webhook_secret:
    file: ${SECRETS_DIR:-./secrets/dev}/payment_webhook_secret
  jwt_secret:
    file: ${SECRETS_DIR:-./secrets/dev}/jwt_secret
  grafana_admin_password:
    file: ${SECRETS_DIR:-./secrets/dev}/grafana_admin_password

volumes:
  postgres_data: {}
  redis_data: {}
  rabbitmq_data: {}
  payment_stub_data: {}
  es_data: {}
  fluent_bit_data: {}
  prometheus_data: {}
  grafana_data: {}

services:
  postgres:
    image: postgres:16.6-alpine
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forsunki}
      POSTGRES_DB: ${POSTGRES_DB:-forsunki}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 512M}
    logging: *default-logging

  redis:
    image: redis:7.4.1-alpine
    restart: unless-stopped
    init: true
    # Redis не умеет читать пароль из файла, поэтому подставляем его при старте.
    # Данные нужны как кэш/сессии/счётчики, не как источник истины, поэтому AOF не включаем.
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$(cat /run/secrets/redis_password)" --save 60 1000
    secrets: [redis_password]
    volumes:
      - redis_data:/data
    networks: [data]
    healthcheck:
      # REDISCLI_AUTH не даёт паролю попасть в список процессов и вывод redis-cli.
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(cat /run/secrets/redis_password) redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}
    logging: *default-logging

  rabbitmq:
    image: rabbitmq:4.4.0-management-alpine
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    hostname: rabbitmq   # имя узла определяет каталог данных: без фиксации том «теряется» при пересоздании
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER:-forsunki}
    # RabbitMQ 4.x объявил RABBITMQ_DEFAULT_PASS_FILE устаревшим и отказывается стартовать с ним.
    # Поэтому перед запуском собираем конфиг начального пользователя из секрета (файл виден только
    # процессу контейнера). Вместо guest (он разрешён лишь с localhost) создаётся отдельный
    # пользователь; пароль применяется только при первом старте с пустым томом.
    command:
      - sh
      - -c
      - |
        umask 077
        printf 'default_user = %s\ndefault_pass = %s\n' "$$RABBITMQ_USER" "$$(cat /run/secrets/rabbitmq_password)" \
          > /etc/rabbitmq/conf.d/20-default-user.conf
        chown rabbitmq:rabbitmq /etc/rabbitmq/conf.d/20-default-user.conf
        exec docker-entrypoint.sh rabbitmq-server
    secrets: [rabbitmq_password]
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks: [data]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 768M}
    logging: *default-logging

  # Одноразовый контейнер миграций: api стартует только после его успешного завершения.
  migrate:
    <<: *api-build
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    init: true
    environment: *api-env
    secrets: [postgres_password, redis_password, rabbitmq_password, jwt_secret, s3_access_key, s3_secret_key, payment_api_key, payment_webhook_secret]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [data]
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}
    logging: *default-logging

  api:
    <<: *api-build
    restart: unless-stopped
    init: true               # PID 1 корректно передаёт сигналы и подбирает «зомби»
    stop_grace_period: 30s   # больше, чем --timeout-graceful-shutdown (25 с) в CMD образа
    environment: *api-env
    secrets: [postgres_password, redis_password, rabbitmq_password, jwt_secret, s3_access_key, s3_secret_key, payment_api_key, payment_webhook_secret]
    depends_on:
      migrate: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    networks: [backend, data]
    # healthcheck описан в Dockerfile (/health/live)
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 512M}
    logging: *default-logging

  # Воркер: тот же образ, что и api, другая команда. Consumer'ы RabbitMQ и relay outbox.
  worker:
    <<: *api-build
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    init: true
    stop_grace_period: 30s   # больше, чем worker_shutdown_timeout_seconds (25 с)
    environment:
      <<: *api-env
      SERVICE_NAME: worker   # поле service в логах воркера
      WORKER_METRICS_PORT: "9100"   # метрики воркера для Prometheus (внутри сети)
    secrets: [postgres_password, redis_password, rabbitmq_password, jwt_secret, s3_access_key, s3_secret_key, payment_api_key, payment_webhook_secret]
    depends_on:
      migrate: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    networks: [backend, data]
    tmpfs: [/tmp]            # здесь воркер пишет файл-«пульс»; остальная файловая система может быть read-only
    healthcheck:
      # Воркер не слушает порт, поэтому о его здоровье говорит свежесть файла, который он обновляет каждые 5 с.
      test:
        - CMD
        - python
        - -c
        - "import os,sys,time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/worker-alive') < 30 else 1)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 512M}
    logging: *default-logging

  # Заглушка платёжного провайдера: создаёт платежи, показывает страницу оплаты, шлёт подписанные webhook'и.
  # Заменяется настоящей онлайн-кассой без изменения кода магазина (он знает только интерфейс PaymentGateway).
  payment_stub:
    build:
      context: ..
      dockerfile: services/payment_stub/Dockerfile
    image: forsunki-payment-stub:dev
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      ENV: ${ENV:-dev}
      WEBHOOK_URL: http://api:8000/payments/webhook   # в личном кабинете настоящего провайдера задаётся так же
      OTEL_ENDPOINT: ${OTEL_ENDPOINT:-}
    secrets: [payment_api_key, payment_webhook_secret]
    volumes:
      - payment_stub_data:/data
    networks: [backend]
    # healthcheck описан в Dockerfile (/health/live)
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}
    logging: *default-logging

  # ------------------------------------------------------------------------------------------ логирование
  # Профиль logging (make up-full). Путь записи: контейнер -> json-file (с ротацией) -> Fluent Bit -> Elasticsearch и S3.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    profiles: [logging]
    restart: unless-stopped
    init: true
    environment:
      discovery.type: single-node
      # В dev без аутентификации: порты опубликованы только на 127.0.0.1. В prod защита включается на этапе 12,
      # а Elasticsearch и Kibana наружу не публикуются.
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      cluster.routing.allocation.disk.threshold_enabled: "false"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 40s
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 1G}
    logging: *default-logging

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.0
    profiles: [logging]
    restart: unless-stopped
    init: true
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      TELEMETRY_OPTIN: "false"
      TELEMETRY_ALLOWCHANGINGOPTINSTATUS: "false"
      # Kibana просит ключ шифрования для сохранённых объектов с секретами; у нас таких нет, ключ только убирает предупреждение.
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: forsunki-dev-kibana-key-0123456789abcdef
      NODE_OPTIONS: --max-old-space-size=512
    depends_on:
      elasticsearch: {condition: service_healthy}
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status | grep -q '\"level\":\"available\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 1G}
    logging: *default-logging

  # Одноразовая настройка: политика ILM, шаблон индекса, data view и дашборд Kibana.
  logging_setup:
    image: curlimages/curl:8.11.1
    profiles: [logging]
    restart: "no"
    entrypoint: ["sh", "/config/kibana/setup.sh"]
    volumes:
      - ./elasticsearch:/config/elasticsearch:ro
      - ./kibana:/config/kibana:ro
    depends_on:
      elasticsearch: {condition: service_healthy}
      kibana: {condition: service_healthy}
    networks: [data]
    logging: *default-logging

  # ------------------------------------------------------------------------------------------ резервные копии
  # Профиль backup. pg_dump по расписанию в S3 (бакет forsunki-backups), хранение BACKUP_KEEP_DAYS дней.
  # Разовая копия: make backup; проверка восстановления: make backup-verify.
  backup:
    profiles: [backup]
    build:
      context: ./backup
    image: forsunki-backup:dev
    restart: unless-stopped
    init: true
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-forsunki}
      PGDATABASE: ${POSTGRES_DB:-forsunki}
      S3_ENDPOINT_URL: ${BACKUP_S3_ENDPOINT_URL:-http://s3:9000}
      BACKUP_BUCKET: ${BACKUP_BUCKET:-forsunki-backups}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    secrets: [postgres_password, s3_access_key, s3_secret_key]
    depends_on:
      postgres: {condition: service_healthy}
      s3: {condition: service_healthy}
    networks: [data]
    read_only: true
    tmpfs: [/tmp]
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}
    logging: *default-logging

  # Сборщик логов. Читает файлы Docker только для чтения; запускается от root, потому что файлы логов принадлежат root.
  # Ключи S3 лежат в файлах секретов, а Fluent Bit читает их из переменных окружения: экспортируем перед запуском.
  fluent-bit:
    image: fluent/fluent-bit:3.2.2-debug
    profiles: [logging]
    restart: unless-stopped
    user: "0:0"
    entrypoint:
      - sh
      - -c
      - |
        export AWS_ACCESS_KEY_ID="$$(cat /run/secrets/s3_access_key)"
        export AWS_SECRET_ACCESS_KEY="$$(cat /run/secrets/s3_secret_key)"
        # Только для Docker Desktop (см. compose.dev.yml): путь с логами делается ссылкой на каталог виртуальной машины.
        if [ -n "$$LOGS_LINK_TARGET" ]; then
          mkdir -p /var/lib/docker
          ln -s "$$LOGS_LINK_TARGET" /var/lib/docker/containers
        fi
        exec /fluent-bit/bin/fluent-bit -c /fluent-bit/etc/fluent-bit.conf
    environment:
      ELASTICSEARCH_HOST: elasticsearch
      DOCKER_LOGS_GLOB: /var/lib/docker/containers/*/*-json.log
      TAIL_INOTIFY: "true"
      LOGS_S3_BUCKET: ${LOGS_S3_BUCKET:-forsunki-logs}
      LOGS_S3_REGION: ${LOGS_S3_REGION:-us-east-1}
      LOGS_S3_ENDPOINT: ${LOGS_S3_ENDPOINT:-http://s3:9000}
    secrets: [s3_access_key, s3_secret_key]
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - fluent_bit_data:/var/lib/fluent-bit
    depends_on:
      elasticsearch: {condition: service_healthy}
      # Сборщик стартует после настройки шаблона индекса: иначе первые записи создали бы индекс с неверными типами полей.
      # Заодно Compose понимает, что одноразовый logging_setup должен завершиться, и не считает его выход ошибкой.
      logging_setup: {condition: service_completed_successfully}
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:2020/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}
    logging: *default-logging

  # ------------------------------------------------------------------------------------------ трассировка
  # Профиль tracing (make up-full). Jaeger принимает трассы по OTLP/HTTP (порт 4318) и хранит их в памяти (dev): после
  # перезапуска трассы пропадают. Для prod нужно постоянное хранилище.
  jaeger:
    image: jaegertracing/all-in-one:1.64.0
    profiles: [tracing]
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      MEMORY_MAX_TRACES: "20000"
    networks: [data]
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 512M}
    logging: *default-logging

  # ------------------------------------------------------------------------------------------ метрики
  # Профиль monitoring (make up-full). Prometheus сам ходит за метриками (pull), поэтому сервисам не нужно знать о нём.
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [monitoring]
    restart: unless-stopped
    init: true
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks: [data]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 512M}
    logging: *default-logging

  # Grafana: источник данных и дашборд создаются из файлов репозитория (provisioning), вручную ничего настраивать не нужно.
  # Пароль администратора берётся из файла секрета (поддержка суффикса __FILE).
  grafana:
    image: grafana/grafana:11.4.0
    profiles: [monitoring]
    restart: unless-stopped
    init: true
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/forsunki.json
    secrets: [grafana_admin_password]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus: {condition: service_healthy}
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 384M}
    logging: *default-logging

  # Сайт: FastAPI + Jinja2 + HTMX. Ходит в api по HTTP, сессии (токены пользователей) хранит в Redis.
  # Базе данных, RabbitMQ и S3 доступа у него нет: всё идёт через api.
  web:
    build:
      context: ..
      dockerfile: services/web/Dockerfile
    image: forsunki-web:dev
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      ENV: ${ENV:-dev}
      API_URL: http://api:8000
      REDIS_HOST: redis
      OTEL_ENDPOINT: ${OTEL_ENDPOINT:-}
    secrets: [redis_password]
    depends_on:
      api: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [backend, data]
    # healthcheck описан в Dockerfile (/health/live)
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}
    logging: *default-logging
