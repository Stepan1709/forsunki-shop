name: forsunki

# Ротация Docker-логов на каждом контейнере: без неё json-file растёт бесконечно.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Общие настройки api, worker и migrate: один образ, разные команды.
x-api-build: &api-build
  image: forsunki-api:dev
  build:
    context: ..
    dockerfile: services/api/Dockerfile

x-api-env: &api-env
  ENV: ${ENV:-dev}
  POSTGRES_HOST: postgres
  POSTGRES_USER: ${POSTGRES_USER:-forsunki}
  POSTGRES_DB: ${POSTGRES_DB:-forsunki}
  REDIS_HOST: redis
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_USER: ${RABBITMQ_USER:-forsunki}

# Сети разделены по назначению. `data` внутренняя (internal): из неё нет выхода наружу,
# а хранилища доступны только приложениям. В dev порты пробрасывает compose.dev.yml.
networks:
  edge: {}
  backend: {}
  data:
    internal: true

# Пароли лежат в файлах и монтируются в /run/secrets/<имя>, а не в environment.
secrets:
  postgres_password:
    file: ${SECRETS_DIR:-./secrets/dev}/postgres_password
  redis_password:
    file: ${SECRETS_DIR:-./secrets/dev}/redis_password
  rabbitmq_password:
    file: ${SECRETS_DIR:-./secrets/dev}/rabbitmq_password

volumes:
  postgres_data: {}
  redis_data: {}
  rabbitmq_data: {}

services:
  postgres:
    image: postgres:16.6-alpine
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forsunki}
      POSTGRES_DB: ${POSTGRES_DB:-forsunki}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 512M}
    logging: *default-logging

  redis:
    image: redis:7.4.1-alpine
    restart: unless-stopped
    init: true
    # Redis не умеет читать пароль из файла, поэтому подставляем его при старте.
    # Данные нужны как кэш/сессии/счётчики, не как источник истины, поэтому AOF не включаем.
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$(cat /run/secrets/redis_password)" --save 60 1000
    secrets: [redis_password]
    volumes:
      - redis_data:/data
    networks: [data]
    healthcheck:
      # REDISCLI_AUTH не даёт паролю попасть в список процессов и вывод redis-cli.
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(cat /run/secrets/redis_password) redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}
    logging: *default-logging

  rabbitmq:
    image: rabbitmq:4.0.4-management-alpine
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    hostname: rabbitmq   # имя узла определяет каталог данных: без фиксации том «теряется» при пересоздании
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER:-forsunki}
    # RabbitMQ 4.x объявил RABBITMQ_DEFAULT_PASS_FILE устаревшим и отказывается стартовать с ним.
    # Поэтому перед запуском собираем конфиг начального пользователя из секрета (файл виден только
    # процессу контейнера). Вместо guest (он разрешён лишь с localhost) создаётся отдельный
    # пользователь; пароль применяется только при первом старте с пустым томом.
    command:
      - sh
      - -c
      - |
        umask 077
        printf 'default_user = %s\ndefault_pass = %s\n' "$$RABBITMQ_USER" "$$(cat /run/secrets/rabbitmq_password)" \
          > /etc/rabbitmq/conf.d/20-default-user.conf
        chown rabbitmq:rabbitmq /etc/rabbitmq/conf.d/20-default-user.conf
        exec docker-entrypoint.sh rabbitmq-server
    secrets: [rabbitmq_password]
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks: [data]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 768M}
    logging: *default-logging

  # Одноразовый контейнер миграций: api стартует только после его успешного завершения.
  migrate:
    <<: *api-build
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    init: true
    environment: *api-env
    secrets: [postgres_password, redis_password, rabbitmq_password]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [data]
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}
    logging: *default-logging

  api:
    <<: *api-build
    restart: unless-stopped
    init: true               # PID 1 корректно передаёт сигналы и подбирает «зомби»
    stop_grace_period: 30s   # больше, чем --timeout-graceful-shutdown (25 с) в CMD образа
    environment: *api-env
    secrets: [postgres_password, redis_password, rabbitmq_password]
    depends_on:
      migrate: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    networks: [backend, data]
    # healthcheck описан в Dockerfile (/health/live)
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 512M}
    logging: *default-logging
