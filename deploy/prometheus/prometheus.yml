# Prometheus: раз в 10 секунд забирает метрики с сервисов внутри сети compose и проверяет правила алертов.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    static_configs: [{targets: ["api:8000"]}]

  - job_name: web
    static_configs: [{targets: ["web:8000"]}]

  # Воркер не веб-сервис: метрики отдаёт его собственный маленький HTTP-сервер (порт 9100).
  - job_name: worker
    static_configs: [{targets: ["worker:9100"]}]

  # RabbitMQ: плагин rabbitmq_prometheus. Подробные метрики по каждой очереди (длина, неподтверждённые) берутся
  # отдельным семейством; именно по ним видно очереди повторов и DLQ.
  - job_name: rabbitmq
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics]
    static_configs: [{targets: ["rabbitmq:15692"]}]

  - job_name: rabbitmq-overview
    metrics_path: /metrics
    static_configs: [{targets: ["rabbitmq:15692"]}]

  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
