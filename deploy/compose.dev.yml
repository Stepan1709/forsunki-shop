# Только для разработки: проброс портов на localhost и вспомогательные инструменты.
# Сеть `data` внутренняя и порты через неё не публикуются, поэтому подключаем `dev`.
volumes:
  s3_data: {}

networks:
  dev: {}

services:
  postgres:
    networks: [data, dev]
    # Хост-порт по умолчанию 5433: 5432 часто занят локальным Postgres на Windows.
    ports: ["127.0.0.1:${POSTGRES_PUBLISH_PORT:-5433}:5432"]

  redis:
    networks: [data, dev]
    ports: ["127.0.0.1:6379:6379"]

  rabbitmq:
    networks: [data, dev]
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"   # веб-интерфейс

  payment_stub:
    networks: [backend, dev]
    environment:
      PUBLIC_BASE_URL: http://localhost:8002   # адрес страницы оплаты для браузера
    ports: ["127.0.0.1:8002:8000"]

  web:
    networks: [backend, data, dev]
    ports: ["127.0.0.1:8000:8000"]   # сайт: http://localhost:8000

  # Стек логов: порты только на localhost (без аутентификации, только для разработки).
  elasticsearch:
    networks: [data, dev]
    ports: ["127.0.0.1:9200:9200"]

  kibana:
    networks: [data, dev]
    ports: ["127.0.0.1:5601:5601"]   # http://localhost:5601

  # Логи уходят и в S3: перед стартом нужен бакет с правилом хранения.
  fluent-bit:
    depends_on:
      s3_logs_init: {condition: service_completed_successfully}
    # Docker Desktop (WSL): настоящие файлы логов лежат в виртуальной машине Docker, а обычное монтирование
    # /var/lib/docker/containers подменяется пустым каталогом дистрибутива. Поэтому в dev обычное монтирование
    # отключено, а /var/lib/docker/containers внутри контейнера становится ссылкой на /proc/1/root/... (корень
    # процесса 1 виртуальной машины). Нужны pid: host и право SYS_PTRACE, а inotify через такую ссылку не работает,
    # поэтому файлы проверяются опросом. Приём только для разработки на Docker Desktop: на Linux-сервере
    # используется обычное монтирование из compose.yml.
    pid: host
    cap_add: [SYS_PTRACE]
    security_opt: ["apparmor=unconfined"]
    environment:
      LOGS_LINK_TARGET: /proc/1/root/var/lib/docker/containers
      TAIL_INOTIFY: "false"
    volumes: !override
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - fluent_bit_data:/var/lib/fluent-bit

  s3_logs_init:
    image: amazon/aws-cli:2.22.0
    profiles: [logging]
    restart: "no"
    entrypoint:
      - sh
      - -c
      - |
        export AWS_ACCESS_KEY_ID="$$(cat /run/secrets/s3_access_key)"
        export AWS_SECRET_ACCESS_KEY="$$(cat /run/secrets/s3_secret_key)"
        export AWS_DEFAULT_REGION=us-east-1
        aws --endpoint-url http://s3:9000 s3api head-bucket --bucket forsunki-logs 2>/dev/null \
          || aws --endpoint-url http://s3:9000 s3api create-bucket --bucket forsunki-logs
        aws --endpoint-url http://s3:9000 s3api put-bucket-lifecycle-configuration \
          --bucket forsunki-logs --lifecycle-configuration file:///config/lifecycle.json
        echo "бакет forsunki-logs готов"
    secrets: [s3_access_key, s3_secret_key]
    volumes:
      - ./s3/lifecycle.json:/config/lifecycle.json:ro
    depends_on:
      s3: {condition: service_healthy}
    networks: [data]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3", labels: "com.docker.compose.service"}

  api:
    networks: [backend, data, dev]
    ports: ["127.0.0.1:8001:8000"]   # документация: http://localhost:8001/docs
    environment:
      # Куда провайдер возвращает покупателя после оплаты: страница заказа на сайте.
      PAYMENT_RETURN_URL: http://localhost:8000/orders/{order_id}
    depends_on:
      s3: {condition: service_healthy}
      payment_stub: {condition: service_healthy}

  # Воркер шлёт письма в Mailpit: он принимает их вместо реальной отправки.
  worker:
    environment:
      SMTP_HOST: mailpit
    depends_on:
      mailpit: {condition: service_healthy}


  # S3-совместимое хранилище (картинки товаров, позже архив логов). Официальные образы MinIO сняты с
  # публикации, поэтому используется RustFS (Apache 2.0, тот же S3 API и веб-консоль).
  # Ключи доступа берём из файлов секретов (общих с api): образ их напрямую не читает, поэтому
  # экспортируем в переменные окружения внутри контейнера перед запуском.
  s3:
    image: rustfs/rustfs:1.0.4
    restart: unless-stopped
    init: true
    entrypoint:
      - sh
      - -c
      - |
        export RUSTFS_ACCESS_KEY="$$(cat /run/secrets/s3_access_key)"
        export RUSTFS_SECRET_KEY="$$(cat /run/secrets/s3_secret_key)"
        exec /entrypoint.sh rustfs
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    secrets: [s3_access_key, s3_secret_key]
    volumes:
      - s3_data:/data
    networks: [data, dev]
    ports:
      - "127.0.0.1:9000:9000"   # S3 API (по этому адресу браузер открывает картинки)
      - "127.0.0.1:9001:9001"   # веб-консоль
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 512M}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3", labels: "com.docker.compose.service"}

  adminer:
    image: adminer:4.8.1
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres: {condition: service_healthy}
    networks: [data, dev]
    ports: ["127.0.0.1:8080:8080"]
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 128M}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3", labels: "com.docker.compose.service"}

  # Принимает письма вместо реальной отправки (SMTP :1025, интерфейс :8025).
  mailpit:
    image: axllent/mailpit:v1.21.8
    restart: unless-stopped
    networks: [backend, dev]
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 128M}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3", labels: "com.docker.compose.service"}
