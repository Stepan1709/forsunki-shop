# Fluent Bit: читает файлы логов Docker, разбирает JSON и отправляет в Elasticsearch и S3.
#
#   /var/lib/docker/containers/*/*-json.log
#        -> tail (с запоминанием позиции) -> разбор обёртки Docker -> имя сервиса из label
#        -> разбор JSON приложения (у остальных контейнеров строка уходит в поле message)
#        -> Elasticsearch (индекс на день)      и      S3 (gzip, префикс service=<имя>/date=<дата>/)
#
# Значения вида ${...} подставляются из переменных окружения контейнера (см. deploy/compose.yml).

[SERVICE]
    Flush                     1
    Log_Level                 info
    Parsers_File              /fluent-bit/etc/parsers.conf
    HTTP_Server               On
    HTTP_Listen               0.0.0.0
    HTTP_Port                 2020
    Health_Check              On
    HC_Errors_Count           5
    HC_Retry_Failure_Count    5
    HC_Period                 60
    # Буфер на диске: если Elasticsearch или S3 недоступны, записи ждут на диске и не теряются при перезапуске.
    storage.path              /var/lib/fluent-bit/storage
    storage.sync              normal
    storage.backlog.mem_limit 50M

[INPUT]
    Name              tail
    # Путь задаётся переменной: на Linux-сервере это /var/lib/docker/containers/*/*-json.log, в Docker Desktop см. compose.dev.yml.
    Path              ${DOCKER_LOGS_GLOB}
    Tag               docker.*
    Parser            docker
    # Позиция чтения хранится в файле: после перезапуска Fluent Bit не читает логи заново и не пропускает новые.
    DB                /var/lib/fluent-bit/tail.db
    DB.sync           normal
    Mem_Buf_Limit     20MB
    storage.type      filesystem
    Skip_Long_Lines   On
    Refresh_Interval  5
    Inotify_Watcher   ${TAIL_INOTIFY}
    Read_from_Head    False

# attrs.com.docker.compose.service -> container_service (имя сервиса compose).
[FILTER]
    Name         nest
    Match        docker.*
    Operation    lift
    Nested_under attrs

[FILTER]
    Name    modify
    Match   docker.*
    Rename  com.docker.compose.service container_service

# Собственные логи Fluent Bit не собираем: иначе его сообщения об отправке порождали бы новые записи по кругу.
[FILTER]
    Name    grep
    Match   docker.*
    Exclude container_service ^fluent-bit$

# JSON приложения: поля строки становятся полями записи. Если строка не JSON (Postgres, RabbitMQ), запись остаётся как есть.
[FILTER]
    Name          parser
    Match         docker.*
    Key_Name      log
    Parser        app_json
    Reserve_Data  On
    Preserve_Key  Off

# Не JSON: текст строки кладём в поле message.
[FILTER]
    Name       modify
    Match      docker.*
    Condition  Key_does_not_exist event
    Rename     log message

# Копия записи с тегом svc.<сервис> нужна для S3 (ключ объекта строится из тега). Оригинал идёт в Elasticsearch.
[FILTER]
    Name                 rewrite_tag
    Match                docker.*
    Rule                 $container_service ^([A-Za-z0-9_-]+)$ svc.$1 true
    Emitter_Name         s3_router
    Emitter_Storage.type filesystem

[OUTPUT]
    Name                es
    Match               docker.*
    Host                ${ELASTICSEARCH_HOST}
    Port                9200
    Logstash_Format     On
    Logstash_Prefix     forsunki-logs
    Logstash_DateFormat %Y.%m.%d
    Suppress_Type_Name  On
    Replace_Dots        On
    Trace_Error         On
    Retry_Limit         False

[OUTPUT]
    Name                          s3
    Match                         svc.*
    bucket                        ${LOGS_S3_BUCKET}
    region                        ${LOGS_S3_REGION}
    endpoint                      ${LOGS_S3_ENDPOINT}
    use_put_object                On
    compression                   gzip
    # Объект закрывается и загружается по времени или по размеру, что наступит раньше.
    upload_timeout                1m
    total_file_size               10M
    store_dir                     /var/lib/fluent-bit/s3
    # Путь: service=<сервис>/date=<ГГГГ-ММ-ДД>/<время>-<uuid>.json.gz (удобно для выборки и для lifecycle-правил).
    s3_key_format                 /service=$TAG[1]/date=%Y-%m-%d/%H%M%S-$UUID.json.gz
    s3_key_format_tag_delimiters  .
    json_date_key                 timestamp
    json_date_format              iso8601
    Retry_Limit                   False
