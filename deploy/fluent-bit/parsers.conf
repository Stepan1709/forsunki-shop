# Обёртка json-file драйвера Docker: {"log":"<строка>\n","stream":"stdout","time":"...","attrs":{...}}
[PARSER]
    Name        docker
    Format      json
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S.%L
    Time_Keep   On

# Строка лога приложения (api, web, worker, payment_stub пишут JSON через structlog).
[PARSER]
    Name        app_json
    Format      json
    Time_Key    timestamp
    Time_Format %Y-%m-%dT%H:%M:%S.%LZ
    Time_Keep   On
