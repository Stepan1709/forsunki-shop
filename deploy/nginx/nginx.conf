# nginx: единственная точка входа в prod. Образ nginx-unprivileged работает не от root и слушает 8080/8443 внутри
# контейнера (наружу они публикуются как 80 и 443).
#
# Что делает:
#   * 80 -> редирект на HTTPS (и путь для проверки домена Let's Encrypt);
#   * 443: TLS, заголовки безопасности, сайт (web) на /, страница оплаты заглушки на /pay/, картинки товаров из S3 на /forsunki-images/;
#   * 8444: Kibana за basic-аутентификацией (для логов);
#   * НЕ публикует /metrics и служебные пути api: метрики забирает Prometheus внутри сети.
#
# Реальный IP клиента: заголовок X-Forwarded-For ПЕРЕЗАПИСЫВАЕТСЯ адресом соединения ($remote_addr), присланное клиентом отбрасывается.
# Дальше сайт и api берут его по цепочке доверенных прокси (app/clientip.py).

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # JSON-логи в stdout (как у остальных сервисов): их соберёт Fluent Bit. Тело запросов и cookie не пишем.
    log_format json escape=json
        '{"timestamp":"$time_iso8601","service":"nginx","level":"info","event":"http_request",'
        '"correlation_id":"$request_id","method":"$request_method","path":"$uri","status":$status,'
        '"duration_ms":"$request_time","bytes":$body_bytes_sent}';
    access_log /dev/stdout json;

    server_tokens off;
    sendfile on;
    keepalive_timeout 30s;
    client_max_body_size 5m;     # загрузка картинок товаров админом: лимит приложения 2 МБ

    # Docker DNS: адреса сервисов перечитываются раз в 10 секунд, иначе nginx запомнил бы IP до перезапуска контейнера.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Защита от перебора на уровне входа: грубый лимит, точные лимиты считает приложение (Redis).
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    limit_req_status 429;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # --- общие настройки проксирования ---
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # correlation_id рождается на границе системы: приложение подхватит его и пронесёт в api, сообщения и логи.
    proxy_set_header X-Request-ID      $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    # 80: редирект и проверка домена Let's Encrypt (certbot кладёт файлы в /var/www/certbot)
    server {
        listen 8080;
        server_name _;

        # проба контейнера (healthcheck)
        location = /nginx-health { return 200 "ok"; }
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 443: сайт
    server {
        listen 8443 ssl;
        http2 on;
        server_name _;

        # Локально самоподписанный сертификат (make tls). Для домена: certbot кладёт fullchain.pem и privkey.pem в те же пути,
        # то есть меняется только содержимое каталога deploy/tls, а не этот файл.
        ssl_certificate     /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Заголовки безопасности. CSP допускает 'unsafe-eval' из-за Alpine.js (он собирает выражения через new Function)
        # и 'unsafe-inline' для стилей (Tailwind и атрибуты style); внешних источников нет.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'" always;

        limit_req zone=general burst=60 nodelay;

        # Метрики и пробы не для внешнего мира.
        location = /metrics { return 404; }
        location /health/ { return 404; }

        # Страница оплаты заглушки провайдера (с настоящим провайдером покупателя перенаправляют на его домен).
        location /pay/ {
            set $stub http://payment_stub:8000;
            proxy_pass $stub;
        }

        # Картинки товаров: ссылки подписаны для публичного адреса сайта, подпись включает заголовок Host,
        # поэтому он передаётся как пришёл. Только чтение.
        location /forsunki-images/ {
            limit_except GET HEAD { deny all; }
            set $s3 http://s3:9000;
            proxy_set_header Host $http_host;
            proxy_pass $s3;
        }

        location / {
            set $web http://web:8000;
            proxy_pass $web;
        }
    }

    # 8444: Kibana за паролем. Kibana из коробки без аутентификации, поэтому наружу только через этот блок.
    server {
        listen 8444 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;

        auth_basic "Forsunki logs";
        auth_basic_user_file /run/secrets/kibana_htpasswd;

        location / {
            set $kibana http://kibana:5601;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 120s;
            proxy_pass $kibana;
        }
    }
}
