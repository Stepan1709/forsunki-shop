[project]
name = "forsunki-payment-stub"
version = "0.1.0"
description = "Заглушка платёжного провайдера ForsunkiShop"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "jinja2>=3.1",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "structlog>=24.4",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "mypy>=1.13",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Покрытие считаем всегда; порог (fail_under) включим вместе с CI.
addopts = "--cov=app --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.mypy]
strict = true
python_version = "3.12"
