{% for i in items %}{% include "shop/_card.html" %}{% endfor %}
{% if next_query %}
  {# Кнопка заменяет сама себя следующей порцией карточек (и новой кнопкой, если страницы ещё есть). #}
  <div class="col-span-full text-center">
    <a href="/shop?{{ next_query }}" class="btn-secondary"
       hx-get="/shop?{{ next_query }}" hx-target="this" hx-swap="outerHTML" hx-push-url="false">
      Показать ещё <span class="spinner"></span>
    </a>
  </div>
{% endif %}
