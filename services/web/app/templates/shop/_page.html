{% for i in items %}{% include "shop/_card.html" %}{% endfor %}
{% if next_query %}
  {# Заменяется вся обёртка кнопки (closest div), а не только ссылка: иначе новые карточки оказались бы
     внутри обёртки col-span-full и растянулись бы на всю ширину вместо ячеек сетки. #}
  <div class="col-span-full text-center">
    <a href="/shop?{{ next_query }}" class="btn-secondary"
       hx-get="/shop?{{ next_query }}" hx-target="closest div" hx-swap="outerHTML" hx-push-url="false">
      Показать ещё <span class="spinner"></span>
    </a>
  </div>
{% endif %}
