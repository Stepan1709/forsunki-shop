{% extends "base.html" %}
{% block title %}Вход: {{ shop.shop_name }}{% endblock %}
{% block content %}
<div class="mx-auto max-w-md">
  <h1 class="text-2xl font-bold">Вход</h1>
  <form method="post" action="/login" class="card mt-4 space-y-4 p-5">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next }}">
    {% if error %}<div class="rounded-lg border border-red-300 bg-red-50 px-4 py-2 text-sm text-red-900 dark:border-red-800 dark:bg-red-950 dark:text-red-200" role="alert">{{ error }}</div>{% endif %}
    <div>
      <label class="label" for="email">Email</label>
      <input id="email" name="email" type="email" class="input" required autocomplete="username" value="{{ email or '' }}" autofocus>
    </div>
    <div>
      <label class="label" for="password">Пароль</label>
      <input id="password" name="password" type="password" class="input" required autocomplete="current-password">
    </div>
    <button class="btn-primary w-full" type="submit">Войти</button>
  </form>
  <p class="mt-4 text-center text-sm text-slate-500">Нет аккаунта? <a class="text-brand-600 underline" href="/register">Зарегистрируйтесь</a></p>
</div>
{% endblock %}
