{% extends "base.html" %}
{% block title %}Управление товарами: {{ shop.shop_name }}{% endblock %}
{% block content %}
<div class="flex flex-wrap items-center justify-between gap-3">
  <h1 class="text-2xl font-bold">Товары</h1>
  <a href="/admin/products/new" class="btn-primary">Добавить товар</a>
</div>

<form method="get" action="/admin/products" class="mt-4 flex gap-3">
  <label class="sr-only" for="q">Поиск</label>
  <input id="q" name="q" type="search" value="{{ q }}" class="input max-w-sm" placeholder="Артикул или двигатель">
  <button class="btn-secondary" type="submit">Найти</button>
</form>
{% if notice %}<p class="mt-2 text-sm text-amber-700 dark:text-amber-400">{{ notice }}</p>{% endif %}

<div class="card mt-4 overflow-x-auto">
  <table class="w-full text-left text-sm">
    <thead class="border-b border-slate-200 text-xs uppercase text-slate-500 dark:border-slate-700">
      <tr><th class="p-3">Артикул</th><th class="p-3">Название</th><th class="p-3">Состояние</th><th class="p-3 text-right">Цена</th><th class="p-3 text-right">Остаток</th><th class="p-3">Статус</th><th class="p-3"></th></tr>
    </thead>
    <tbody id="rows" class="divide-y divide-slate-200 dark:divide-slate-700">
      {% include "admin/_rows.html" %}
    </tbody>
  </table>
</div>
{% endblock %}
