[project]
name = "forsunki-api"
version = "0.1.0"
description = "Бэкенд ForsunkiShop: модульный монолит (FastAPI)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aio-pika>=9.4",
    "aioboto3>=13",
    "aiosmtplib>=5.1.3",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "httpx>=0.28",
    "itsdangerous>=2.2",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-asyncpg>=0.66b2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-instrumentation-httpx>=0.66b2",
    "opentelemetry-instrumentation-redis>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "prometheus-client>=0.26.0",
    "pydantic-settings>=2.6",
    "pydantic[email]>=2.9",
    "pyjwt>=2.9",
    "python-multipart>=0.0.12",
    "redis>=5.2",
    "sqladmin>=0.20",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.4",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "mypy>=1.13",
    "ruff>=0.8",
    "testcontainers[minio,postgres,rabbitmq,redis]>=4.8",
    "hypothesis>=6.115",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Покрытие считаем всегда; порог (fail_under) включим вместе с CI.
addopts = "--cov=app --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
branch = true
# SQLAlchemy async исполняет код в greenlet: без этого покрытие занижается.
concurrency = ["thread", "greenlet"]
source = ["app"]

[tool.mypy]
strict = true
python_version = "3.12"

# Библиотеки без аннотаций типов: mypy не должен падать на их импорте.
[[tool.mypy.overrides]]
module = ["aioboto3.*", "boto3.*", "botocore.*", "aiobotocore.*", "sqladmin.*", "wtforms.*"]
ignore_missing_imports = true
